name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt

    - name: Run Pytest Core Cases
      env:
        PYTHONPATH: api
      run: |
        pytest api/tests/test_api.py -v

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Lint
      working-directory: ./frontend
      run: npm run lint

    - name: Build
      working-directory: ./frontend
      run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
    - uses: actions/checkout@v3

    - name: Build backend image
      run: docker build -f backend.Dockerfile -t bde-api:ci .

    - name: Build frontend image
      run: docker build -f frontend.Dockerfile -t bde-frontend:ci .

    - name: Boot backend container and check /health
      run: |
        docker run -d --name bde-api-ci -p 8000:8000 bde-api:ci
        for i in $(seq 1 15); do
          if curl -sf http://localhost:8000/health; then echo "backend healthy"; exit 0; fi
          sleep 2
        done
        echo "backend never became healthy"; docker logs bde-api-ci; exit 1
